aid: thayermahan
name: ThayerMahan
description: 'ThayerMahan, Inc. is a U.S. maritime autonomy and ocean-intelligence company
  headquartered in Groton, Connecticut, founded in 2016 and led by former U.S. Navy Vice
  Admiral Michael Connor. It builds and operates uncrewed surface and subsurface sensing
  systems — Outpost, SeaPicket, SeaGuard (a non-kinetic counter-UUV defeat system) and
  the TransparenSea data platform — combining passive acoustic arrays, electronic sensors,
  edge processing, AI classification and human analysts to deliver persistent undersea
  surveillance, port and critical-infrastructure security, subsea infrastructure monitoring,
  passive acoustic marine-mammal monitoring and illegal-fishing (IUU) detection for defense,
  government and commercial offshore customers. ThayerMahan sells outcomes as a service
  rather than developer tooling: it publishes no developer portal, no API documentation
  and no machine-readable contract. The only public reference to programmatic access is
  on the TransparenSea page, which states that contact reports are delivered by application
  programming interface (API), voice report, or other means in near real-time — a
  customer-delivery integration negotiated per engagement, not a self-serve public API.
  Its GitHub organization holds two forks of third-party tools and no first-party libraries.'
